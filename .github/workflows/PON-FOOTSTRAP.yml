# SPDX-License-Identifier: MIT
# PON（Nokia XG-040G-MF）with the third-party footstrap theme and the
# luci-app-pon-status optics card.
#
# 主题和卡片的包都不在官方 feeds 里，由 Scripts/Packages.sh 现场 clone：
#   配置名带 FOOTSTRAP -> clone VizzleTF/luci-theme-footstrap
#   配置名以 PON- 开头 -> clone naoki66/OpenWrt_ONU_CONFIG 里的 luci-app-pon-status

name: PON-FOOTSTRAP

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: PON-AN7583-FOOTSTRAP
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: PON-AN7583-FOOTSTRAP
      WRT_THEME: footstrap
      WRT_NAME: ImmortalWrt
      WRT_SSID: DWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.86.1
      WRT_PW: password
      WRT_REPO: https://github.com/pbs05/ponwrt.git
      WRT_BRANCH: master
      WRT_SOURCE: pbs05/ponwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
