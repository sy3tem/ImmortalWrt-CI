# SPDX-License-Identifier: MIT
# PON（Nokia XG-040G-MF）with the third-party 7Dollar theme, default palette blue.
#
# 跟 PON-ALL 的区别只有主题：WRT_THEME=7dollar 换掉默认的 argon。
# 主题由 Scripts/Packages.sh 现场 clone（配置名带 7DOLLAR 时触发）。

name: PON-7DOLLAR

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: PON-AN7583-7DOLLAR
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: PON-AN7583-7DOLLAR
      WRT_THEME: 7dollar
      WRT_NAME: ImmortalWrt
      WRT_SSID: DWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.86.1
      WRT_PW: password
      WRT_REPO: https://github.com/pbs05/ponwrt.git
      WRT_BRANCH: master
      WRT_SOURCE: pbs05/ponwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
