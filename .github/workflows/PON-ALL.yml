# SPDX-License-Identifier: MIT
# Airoha PON ONT (Nokia XG-040G-MF / FiberHome 等) build matrix.
#
# Devices : AN7583 — Nokia XG-040G-MF (UBI)
#           AN7581 — FiberHome / Nokia / Gemtek / UnionMan / ZNXT / H3C
# Source  : pbs05/ponwrt @ master
#           ImmortalWrt 派生树，带 openwrt-pon-drivers / openwrt-pon-userspace 两个 feed
#           （PON 驱动 + airoha-ponctl/pond + luci-app-pon 只在这棵树里有）
# Config  : Config/GENERAL-PON.txt + Config/PON-<SoC>.txt
#           （无 eMMC → 不做 /opt 数据分区挂载；不带 open-box；不开 flow offload）
#
# 内存容量：ponwrt 自带的 U-Boot 的 dram_init() 只读 DTS 里的 512M 保底值再 fixup
# 给内核，1G 颗粒会被摁回 512M。设备上的 FIP 已经换成 Loong1996/ImmortalWrt-Airoha
# 发布的 an7583-nokia-xg-040g-mf-bl31-uboot.fip（带 DRAM 地址回绕探测），
# 串口实测 "dram: 1024 MiB probed ... 1 GiB"、内核 Memory: 948640K/1048576K。
# 所以固件本身不需要按容量分档 —— 只要 bootloader 是那一版就行。
#
# 注意：Loong1996/immortalwrt 那棵树虽然也有 airoha 支持，但它**不带 PON 用户态**
# （实测 defconfig 后 CONFIG_PACKAGE_airoha-ponctl / airoha-pond / luci-app-pon
# 全是空的），所以源码仍然用 ponwrt。

name: PON-ALL

on:
  workflow_dispatch:
    inputs:
      CONFIGS:
        description: 'JSON 数组，如 ["PON-AN7583"]；留空则编译全部。'
        required: false
        type: string
      PACKAGE:
        description: '手动调整插件包，多个用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: ${{ fromJSON(inputs.CONFIGS || '["PON-AN7583"]') }}
        SOURCE: [pbs05/ponwrt]
        BRANCH: [master]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: DWRT
      WRT_SSID: DWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.86.1
      WRT_PW: password
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
