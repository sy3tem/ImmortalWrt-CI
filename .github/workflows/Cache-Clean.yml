# SPDX-License-Identifier: MIT
# Weekly cache purge (ccache + staging_dir caches grow fast across many configs).

name: Cache-Clean

on:
  schedule:
    - cron: 0 20 * * 0
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: |
          # `gh cache delete --all` exits 1 when there is nothing to delete
          # ("X No caches to delete"), which marks this scheduled job as failed.
          # Check first and exit cleanly when the cache list is empty.
          if [ -z "$(gh cache list --limit 1)" ]; then
            echo "No caches to delete."
            exit 0
          fi
          gh cache delete --all
