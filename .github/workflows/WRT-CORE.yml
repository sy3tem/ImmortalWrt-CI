# SPDX-License-Identifier: MIT
# ImmortalWrt unified cloud build core.
#
# Source of truth: the OFFICIAL immortalwrt/immortalwrt tree (no vendor fork).
# Output naming  : kept 100% identical to the upstream release naming.
#                 Wi-Fi / no-Wi-Fi (and -full) variants are distinguished by the
#                 RELEASE TAG, never by renaming the image files.

name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_CONFIG}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        # 只装编译依赖就够。原来的 apt full-upgrade 在 runner 上能跑 6 分钟到 3 小时
        # （见历史 run：01:02 -> 04:16），是整条流水线最不可控的一段，直接去掉。
        # 官方 init_build_environment.sh 仍会用，但限时 8 分钟；超时就退回本文件
        # 自带的依赖清单，保证这一步最长 15 分钟。
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail

          sudo -E apt-get -yq update
          sudo -E apt-get -yq purge firefox 2>/dev/null || true

          DEPS="build-essential gcc g++ make gawk gettext git libncurses-dev libssl-dev \
            libgnutls28-dev python3 python3-pyelftools python3-setuptools rsync unzip \
            zlib1g-dev file wget curl subversion flex bison bc cpio time swig libelf-dev \
            liblzma-dev device-tree-compiler u-boot-tools ccache dos2unix libfuse-dev \
            zstd xxd patch diffstat quilt autoconf automake libtool pkg-config"
          EXTRA="python3-distutils libncurses5-dev"
          sudo -E apt-get -yq --no-install-recommends install $DEPS
          sudo -E apt-get -yq install $EXTRA 2>/dev/null || true

          # 默认跳过官方 init_build_environment.sh：该脚本会拉取并安装 texlive /
          # lmodern 等大量文档工具（固件编译并不需要），且偶发在 8 分钟超时后被
          # 杀，遗留 half-configured 的 dpkg 包，引发锁冲突与 "dpkg was interrupted"
          # 失败（见历史失败 run）。历史已验证：仅用上方 DEPS/EXTRA 清单即可成功
          # 编译（上游脚本超时退回清单时 RK/QCA/ARMSR 均成功）。如确需启用上游
          # 脚本，将下方 WRT_SKIP_UPSTREAM 设为非 1 即可。
          WRT_SKIP_UPSTREAM="${WRT_SKIP_UPSTREAM:-1}"
          if [ "$WRT_SKIP_UPSTREAM" != "1" ]; then
            echo "== running upstream build-environment script (8 min cap) =="
            if sudo timeout 480 bash -c 'DEBIAN_FRONTEND=noninteractive bash <(curl -fsSL --max-time 60 https://build-scripts.immortalwrt.org/init_build_environment.sh)'; then
              echo "upstream build-environment script finished"
            else
              echo "WARN: upstream script timed out or failed; explicit dependency list above is what we rely on"
            fi
            # 等孤儿 dpkg/apt 自然完成配置并释放锁，再修复可能的 half-configured 包
            i=0
            while pgrep -f '/usr/bin/dpkg|apt-get|/usr/lib/apt' >/dev/null 2>&1; do
              [ "$i" -ge 120 ] && break
              sleep 5; i=$((i+1))
            done
            sudo dpkg --configure -a || true
            sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock 2>/dev/null || true
          else
            echo "== skip upstream build-environment script (use explicit DEPS only) =="
          fi

          sudo -E apt-get -yq autoremove --purge
          sudo -E apt-get -yq clean
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -sfn /mnt/build_wrt $GITHUB_WORKSPACE/wrt
          date -u

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          # 仅含"日期"的标签，用于把同一天各平台（RK / QCA / ARMSR）的固件
          # 合并进【同一个 Release】，避免每个平台各生成一个 Release 导致列表越积越多。
          echo "WRT_DATE_DAY=$(TZ=UTC-8 date +"%y.%m.%d")" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          # variant marker used in the release tag only (files keep upstream names)
          case "${WRT_CONFIG^^}" in
            *NOWIFI*) echo "WRT_VARIANT=nowifi" >> $GITHUB_ENV ;;
            *FULL*)   echo "WRT_VARIANT=full"   >> $GITHUB_ENV ;;
            *)        echo "WRT_VARIANT=base"   >> $GITHUB_ENV ;;
          esac

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          # keep .git so that `git apply --3way` works for the compat patches
          cd $GITHUB_WORKSPACE

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build
            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done
            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          # NOTE: runs with CWD = <tree>/package (see Scripts/Packages.sh)
          WRT_CONFIG="$WRT_CONFIG" WRT_TARGET="$WRT_TARGET" bash $GITHUB_WORKSPACE/Scripts/Packages.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            # GENERAL first (global defaults), device config last so a device
            # file can always override any GENERAL line (later wins in kconfig).
            cat $GITHUB_WORKSPACE/Config/GENERAL.txt $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          fi

          WRT_CONFIG="$WRT_CONFIG" WRT_TARGET="$WRT_TARGET" bash $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          # must run AFTER defconfig: DEVICE_PACKAGES are force-installed into
          # the rootfs, so the NOWIFI variants need their per-device package
          # lists trimmed here (setting CONFIG_PACKAGE_x=n is not enough).
          WRT_CONFIG="$WRT_CONFIG" WRT_TARGET="$WRT_TARGET" bash $GITHUB_WORKSPACE/Scripts/Post-Defconfig.sh

          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            # drop metadata-only artifacts; KEEP the original upstream file names
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            # ---- 附件分类 + 配对重命名 -------------------------------------------
            # GitHub Release 附件按文件名排序、无法自定义分组，这里用前缀把三类在
            # 列表里天然分开，并让同一设备的“配置”与“固件”文件名紧邻：
            #   nowifi_ 不带 WiFi 设备 | vm_ 虚拟机(armsr / x86) | wifi_ 带 WiFi 设备
            #   每设备：<CAT>_<CONFIG>_config.txt 紧挨 <CAT>_<CONFIG>_immortalwrt-...
            # 同时永不发布 u-boot（刷机用出厂 bootloader 即可，release 不需要）。
            case "${WRT_CONFIG^^}" in
              *NOWIFI*) CAT="nowifi" ;;
              *ARMSR*|*X86*) CAT="vm" ;;
              *) CAT="wifi" ;;
            esac
            cd ./upload
            for c in Config-*.txt; do
              [ -f "$c" ] && mv -f "$c" "${CAT}_${WRT_CONFIG}_config.txt"
            done
            for f in $(ls | grep -v "^${CAT}_${WRT_CONFIG}_" | grep -v "u-boot"); do
              [ -f "$f" ] && mv -f "$f" "${CAT}_${WRT_CONFIG}_${f}"
            done
            rm -f ./*u-boot*
            cd ..

            # --- armsr / UEFI VM (fnOS, KVM): 8 GiB sparse qcow2 ---------------
            # 出厂 qcow2 只有 ~64 MiB 虚拟容量，导入虚拟机后放不下 docker 镜像。
            # 先把虚拟容量抬到 8 GiB，growroot 首启会把 p2 和 ext4 扩满整块盘。
            if [[ "${WRT_TARGET,,}" == *armsr* ]]; then
              command -v qemu-img >/dev/null || sudo apt-get -y install qemu-utils
              for q in ./upload/*.qcow2; do
                [ -f "$q" ] || continue
                qemu-img resize "$q" 8G
                echo "resized: $q"
                qemu-img info "$q" | head -3
              done
            fi

            make clean -j$(nproc)
          fi

      - name: UEFI Boot Smoke Test (armsr)
        # Boot the built qcow2 with real edk2/AAVMF firmware under QEMU and check
        # that the guest comes up as expected (UEFI, NIC autodetect, growroot,
        # LuCI, rtp2httpd, quickstart). Only for the armsr/UEFI platform.
        # Non-blocking: a TCG-slow guest must not throw away the whole compile.
        continue-on-error: true
        if: env.WRT_TEST != 'true' && contains(env.WRT_TARGET, 'armsr')
        run: |
          sudo apt-get -y install qemu-system-arm qemu-efi-aarch64 sshpass netcat-openbsd
          chmod +x "$GITHUB_WORKSPACE/Scripts/verify-armsr.sh"
          bash "$GITHUB_WORKSPACE/Scripts/verify-armsr.sh" ./wrt/upload

      - name: Upload Test Config
        # TEST runs never touch the Releases page; hand the generated .config
        # back as a workflow artifact so it can still be inspected/verified.
        if: env.WRT_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Config-${{env.WRT_CONFIG}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          path: ./wrt/upload/*.txt
          retention-days: 7

      - name: Release Firmware
        # TEST runs only emit a .config, never a release
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@master
        with:
          # 按"天"聚合：同一天 RK / QCA / ARMSR 所有平台的固件合并进同一个 Release，
          # 所有附件统一显示在一个 Release 下，而不是每个平台挨个列出。
          tag_name: ${{env.WRT_BRANCH}}-${{env.WRT_DATE_DAY}}
          files: ./wrt/upload/*.*
          body: |
            本 Release 聚合了同一天构建的全部平台固件（RK / QCA / ARMSR 等），
            内含多个设备，请选择你需要的设备固件。

            源码：${{env.WRT_REPO}}（官方源）
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            提示：固件文件名与 ImmortalWrt 官方发布保持一致
            （immortalwrt-<平台>-<子目标>-<设备>-squashfs-sysupgrade.*）。

            附件按类别前缀分组（GitHub 按文件名排序，三类天然分开）：
              nowifi_ 不带 WiFi 的设备
              vm_     虚拟机镜像（armsr / x86，UEFI 启动，可直接导入 KVM / fnOS / VMware / Proxmox）
              wifi_   带 WiFi 的设备
            每个设备 “<CAT>_<CONFIG>_config.txt” 紧邻其固件，方便一一对应下载。
