# SPDX-License-Identifier: MIT
# Qualcommax (IPQ60xx / IPQ807x) build matrix.
#
# Devices : 亚瑟 JDCloud RE-SS-01 (ipq6000) / 雅典娜 JDCloud RE-CS-02 (ipq6010)
#           (both are supported by the OFFICIAL immortalwrt tree already)
# Source  : immortalwrt/immortalwrt @ master
#
# Wi-Fi / no-Wi-Fi variants are separate configs -> separate release tags,
# so the produced image file names stay 100% upstream-identical.

name: QCA-ALL

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      CONFIGS:
        description: 'JSON 数组，如 ["JDCLOUD-RE-SS-01-WIFI"]；留空则编译全部。'
        required: false
        type: string
      PACKAGE:
        description: '手动调整插件包，多个用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: ${{ fromJSON(inputs.CONFIGS || '["JDCLOUD-RE-SS-01-WIFI", "JDCLOUD-RE-SS-01-NOWIFI", "JDCLOUD-RE-CS-02-WIFI", "JDCLOUD-RE-CS-02-NOWIFI"]') }}
        SOURCE: [immortalwrt/immortalwrt]
        BRANCH: [master]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: DWRT
      WRT_SSID: DWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: password
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
