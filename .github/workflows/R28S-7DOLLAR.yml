# SPDX-License-Identifier: MIT
# NanoPi R28S with the third-party 7Dollar theme (default palette: blue / mist).
#
# Source : immortalwrt/immortalwrt @ master
# Theme  : https://github.com/itsmaiGe/luci-theme-7dollar (not in the official feeds,
#          Scripts/Packages.sh clones it into package/ and pins palette to 'mist')
#
# 单独一个 workflow，因为它跟 RK-ALL 的主题参数不一样（WRT_THEME 是 workflow 级输入）。

name: R28S-7DOLLAR

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: R28S-7DOLLAR
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: R28S-7DOLLAR
      WRT_THEME: 7dollar
      WRT_NAME: ImmortalWrt-sy3tem
      WRT_SSID: DWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: password
      WRT_REPO: https://github.com/immortalwrt/immortalwrt.git
      WRT_BRANCH: master
      WRT_SOURCE: immortalwrt/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
